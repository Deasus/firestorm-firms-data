name: update-firms

# Self-redispatching loop pattern (matches firestorm-lightning-data /
# firestorm-ngfs-data / firestorm-goes-fire-data). Cron is the
# dead-man restart; the in-run loop fires fetch every ~3 min for
# ~12 min and then re-dispatches itself, sidestepping GHA's
# schedule-throttling on hot repos.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min as the dead-man fallback
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fetch_firms.py'
      - '.github/workflows/update-firms.yml'

permissions:
  contents: write
  actions: write   # needed for self-redispatch via gh workflow run

concurrency:
  group: update-firms
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2026-10-05 — queue the NEXT run FIRST. The concurrency group holds it until this run
      # finishes, so a slow, failed or cancelled run can no longer break the chain. Before, the
      # re-dispatch was the LAST step: on 2026-10-05 the runs at 11:56Z and 14:17Z hit the
      # 15-min timeout (NASA timing out from GitHub's runners), never reached it, and FIRMS
      # stopped until GitHub's throttled schedule fired hours later.
      - name: queue the next run (first, so this run cannot break the chain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-firms.yml --ref main || echo "::warning::re-dispatch failed; the schedule will restart the chain"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2026-10-16 — the feed is global now (~300k detections/cycle). Without numpy +
      # scikit-learn the deconflicter falls back to pure-Python brute force, which
      # cannot keep up at that volume.
      - name: install deps
        run: python -m pip install --quiet numpy scikit-learn

      # 2026-10-16 — restore the previous global files (from the single-commit `global`
      # branch) so a source that times out this run carries its rows forward instead of
      # vanishing. data/global/ is gitignored on main; the index is reset afterwards.
      - name: restore previous global files
        run: |
          mkdir -p data/global
          if git fetch --quiet --depth 1 origin global 2>/dev/null; then
            git --work-tree=data/global checkout --quiet FETCH_HEAD -- . && git reset --quiet
            echo "restored $(ls data/global | wc -l) global files"
          else
            echo "no global branch yet — first run"
          fi

      - name: fetch FIRMS + VIIRS in a loop (4 cycles, ~3 min apart)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          set -e
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::error::FIRMS_MAP_KEY secret not set on repo"
            exit 1
          fi
          # Reduced 4→2 cycles 2026-07-02: after adding the deconflict layer
          # (7MB land polygon fetch + 11k-source BallTree build per Python
          # invocation, since the process is fresh each cycle), 4 cycles of
          # ~90-180s regularly overran the 15-min workflow timeout and every
          # run got cancelled with STALE data left on origin. 2 cycles is
          # still faster than the 15-min cron cadence and keeps cadence honest.
          for cycle in 1 2; do
            echo "::group::cycle $cycle"
            python3 fetch_firms.py
            echo "::endgroup::"
            if [ "$cycle" -lt 2 ]; then
              sleep 180
            fi
          done

      - name: commit + push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
          else
            git commit -m "auto-update firms.json + viirs.json + health.json"
            # Race-safe push: 4 attempts. Concurrent runs of this same workflow
            # (15-min cron + self-redispatch + push triggers) can land on
            # origin between the runner's checkout and its push, causing
            # 'fetch first' rejection.
            #
            # Data-file merge conflict resolution: our JSONs (firms.json /
            # viirs.json / health.json) are always regenerated wholesale — any
            # conflict is a race, not a semantic disagreement. In a race the
            # NEWER commit wins (our new data is fresher than theirs was).
            # We resolve with `-X ours` which takes OUR version when a conflict
            # arises during rebase. Verified 2026-07-02 after v2_331 pushed
            # (self-mine adaptive tune) and two pipelines raced, causing 4
            # rejected pushes over 4 attempts.
            for attempt in 1 2 3 4; do
              if git push 2>&1; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push attempt $attempt rejected — fetching + rebasing (ours-preferred)"
              git fetch origin main
              git rebase -X ours origin/main || { git rebase --abort; sleep 5; }
            done
            echo "::error::push failed after 4 attempts"
            exit 1
          fi

      # 2026-10-16 — global per-region files go to the `global` branch as ONE commit with
      # no parent, force-pushed every run: the client always reads the latest, and the
      # repo never accumulates history for several MB of data every few minutes.
      - name: publish global files (single-commit branch)
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f data/global/index.json ]; then echo "no global output this run"; exit 0; fi
          export GIT_INDEX_FILE="$(mktemp)"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree=data/global add -A .
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
                   commit-tree "$tree" -m "global FIRMS $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force --quiet origin "${commit}:refs/heads/global"
          echo "published $(ls data/global | wc -l) files to branch global (${commit})"
